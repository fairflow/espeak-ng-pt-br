# Email Configuration Template for Miolingo Admin Dashboard
# Copy this section to your .streamlit/secrets.toml file

[email]
imap_server = "mail.yourdomain.com"  # Your IMAP server address
imap_port = 993                       # IMAP SSL port (usually 993)
email_address = "io@miolingo.io"     # Email address to monitor
email_password = "your_password"      # Email account password

# Example for common providers:
#
# Gmail:
#   imap_server = "imap.gmail.com"
#   imap_port = 993
#   Note: You may need to use an "App Password" instead of your regular password
#
# Outlook/Office365:
#   imap_server = "outlook.office365.com"
#   imap_port = 993
#
# Yahoo:
#   imap_server = "imap.mail.yahoo.com"
#   imap_port = 993
